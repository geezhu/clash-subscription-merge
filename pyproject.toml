[project]
name = "clash-subscription-merge"
version = "0.1.0"
description = "多订阅多端口 mihomo / Clash Verge Rev 配置生成器"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["ruamel.yaml", "requests"]

[project.urls]
Repository = "https://github.com/geezhu/clash-subscription-merge"

# 安装后可直接运行：clash-merge
[project.scripts]
clash-merge = "merge:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["merge.py", "share_links.py"]

# 模板随包发布：仓库里的 config/ 安装后位于 merge_config/（merge.py 会自动找到）
[tool.hatch.build.targets.wheel.force-include]
"config" = "merge_config"

[tool.hatch.build.targets.sdist]
include = ["merge.py", "share_links.py", "config", "README.md", "pyproject.toml"]
