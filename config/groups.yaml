# 模板分组。每个入口（端口）各生成一份，名字自动加 "<入口名>/" 前缀。
# proxies 里可写：DIRECT / REJECT 等内置、本文件里的其他组名、LEAF。
# LEAF = "该入口的全部节点"：远程订阅 -> 写入 use，本地节点 -> 写入 proxies（可同时存在）。
# standalone: true = 不被其他组/规则引用的独立组（如测速组），不会触发"未被引用"警告，该字段不会写入输出。
# scope: shared = 全局只生成一份：名字不加入口前缀，LEAF 展开为【所有来源】的全部节点（与是否有 ALL 入口无关）。
#   共享组里引用【每个入口的组】（如 🚀 节点选择）时，会展开成所有入口各自的那个组（main/🚀 节点选择、mix/🚀 节点选择 ...）。
#   注意不要让入口组与共享组互相引用，避免循环。该字段不会写入输出。
# scope: default = 只给默认入口（default: true，如 ALL）生成；其他入口没有该组，rules.yaml 里指向它的规则也会在其他入口中被省略。
groups:
  - name: 🚀 节点选择
    type: select
    proxies: [DIRECT, LEAF]

  - name: ♻️ 延迟测试
    type: url-test
    scope: shared
    standalone: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: [LEAF]

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🚀 节点选择]

  - name: 🛑 广告拦截
    type: select
    scope: shared
    proxies: [REJECT, DIRECT, 🚀 节点选择]   # 🚀 节点选择 会展开为每个入口各自的节点选择

  - name: 🔍 Google
    type: select
    scope: shared
    proxies: [DIRECT, LEAF]

  - name: 🤖 AI服务
    type: select
    scope: default
    proxies: [🚀 节点选择, DIRECT, LEAF]
